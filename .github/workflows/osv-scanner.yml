name: OSV-Scanner

# Scans vcpkg.json against the OSV database. Visible-only by design
# (fail-on-vuln: false): findings land in the Security > Code scanning tab
# for both the PR and scheduled scans, but don't block merges. Dependency
# Review is this repo's one blocking dependency check — see
# docs/branch-protection.md.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "45 3 * * 1"
  workflow_dispatch:

# Nothing at the top level: each job below grants what the reusable workflow
# it calls needs.
permissions: {}

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: false

  scan-scheduled:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: false
