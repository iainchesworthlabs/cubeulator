name: Tag a release

# Makes the tag of a release, with the release bot's token, so that the owner can start a release from a phone: run it
# (Actions, Tag a release, Run workflow, branch develop) after the pull request that prepared the release
# (tools/release/prepare_release.py) has merged. The tag starts the Release workflow (release.yml), which builds, and
# whose publish job then waits for the owner to approve the `release` environment (docs/releasing.md).
#
# The `tags` ruleset lets only organisation admins and the release bot create a v* tag, so the workflow's own token
# cannot, and a tag pushed with it would not start the Release workflow either. A tag made with an App token does.
#
# The tag is made on the commit this run is on: the tip of develop when it was started. That is the commit that is
# released, so look at it first: the version and changelog it holds are checked here the way the Release workflow
# will check them, and a tag that already exists is refused.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release, without the v: 1.0.0, or 1.0.0-rc.1 for a pre-release. It must be the version
          CMakeLists.txt declares and have a dated section in CHANGELOG.md.
        type: string
        required: true

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Make the tag
    # The Release workflow wants the tag on a commit of develop, and the commit is the one this run is on.
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version, the changelog and the tag
        id: check
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not a version (1.0.0 or 1.0.0-rc.1, no v)"; exit 1; }
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::The tag $tag already exists. Release it again by running the Release workflow on it, or prepare a new version."
            exit 1
          fi
          python3 tools/release/check_release.py --tag "$tag" --github-output "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create a token for the release bot
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Make the tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          {
            echo "### Tagged $TAG"
            echo
            echo "The tag is on \`$GITHUB_SHA\`, the tip of develop. The Release workflow has started; its publish job waits for you to approve the \`release\` environment."
          } >> "$GITHUB_STEP_SUMMARY"
