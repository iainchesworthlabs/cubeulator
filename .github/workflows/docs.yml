name: Docs

# The Cubeulator pages, the user guide and the web app, at https://iainchesworthlabs.com/cubeulator/ (docs/ci.md, "The
# Cubeulator pages"). A pull request builds the pages and, from this repository, puts a preview at
# https://iainchesworthlabs.com/_preview/cubeulator/pr-<n>/ (the pages only: a preview blocks every script, so the web app
# is not built for it). A push to the branch `site` builds the pages and the web app, and publishes both.
#
# The branch `site` is moved only by publish-site.yml, by hand, to the tip of develop. A merge to develop does not publish.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
  # A push to `site` runs this workflow and no other, because ci.yml runs for pull requests, the merge queue and develop.
  # There is no path filter: `site` moves only when someone has asked for the site to go up.
  push:
    branches: [site]

permissions: {}

jobs:
  # A pull request: the pages, built with --strict. The shared workflow uploads them as the artifact the preview publishes.
  build:
    name: Build site
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      requirements: docs/requirements.txt
      site-artifact: docs-site

  # A push to `site`. The browser build is its own job: it is the slow one (vcpkg builds OpenCV for WebAssembly), and the
  # pages do not need it to render. It is built only when something it is built from has changed since the last publish:
  # a change to the pages alone (the usual publish) finds the app of the last publish in the cache and finishes in a minute
  # or two. The key is the hash of every file the browser build reads, so a cache hit is exactly the app this source makes.
  web:
    name: Build the web app
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VCPKG_MAX_CONCURRENCY: "4"
    steps:
      # fetch-depth: 0 so the version header can name the nearest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Restores the built app on a hit, and saves it when the job succeeds after a miss. The caches of the branch `site`
      # are the ones this job can read, so a build on a pull request or on develop is not mixed in.
      - name: Look for the web app of this source
        id: cached
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/web-emscripten-release/bin
          key: cubeulator-web-app-${{ hashFiles('src/**', 'cmake/**', 'third_party/**', 'vcpkg-overlay-ports/**', 'packaging/web/**', 'docs/design/identity/**', 'CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json', '.github/actions/web-build/**') }}

      - name: Say which
        shell: bash
        env:
          HIT: ${{ steps.cached.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            echo "The web app is unchanged since the last publish: reusing it, with no build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The web app has changed, or nothing is cached: building it (this takes a while)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up vcpkg
        if: steps.cached.outputs.cache-hit != 'true'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
        with:
          cache-key-suffix: wasm32-emscripten-threads

      - name: Build the web app
        if: steps.cached.outputs.cache-hit != 'true'
        uses: $/.github/actions/web-build

      - name: Check the app is there
        shell: bash
        run: |
          set -euo pipefail
          [ -f build/web-emscripten-release/bin/index.html ] || { echo "::error::the web app has no index.html: was it built, or was the cache empty?"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cubeulator-web
          path: build/web-emscripten-release/bin
          if-no-files-found: error
          retention-days: 7

      - name: Save vcpkg binaries
        if: ${{ always() && steps.cached.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30

  # The pages and the web app as one site. The app goes under app/, which is where the pages link. It is static files; the
  # edge serves .wasm as application/wasm. The app cannot get the response headers its threads need from the edge, so it brings
  # its own service worker for that (cubeulator-isolation.js), and because that worker's scope is the directory it is served
  # from, it affects nothing outside app/.
  assemble:
    name: Build site for the domain
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the docs tooling
        run: python3 -m pip install --quiet -r docs/requirements.txt

      - name: Build the pages
        run: mkdocs build --strict --site-dir site

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cubeulator-web
          path: site/app

      - name: Check the app is there
        run: |
          set -euo pipefail
          [ -f site/app/index.html ] || { echo "::error::the web app has no index.html: was it built?"; exit 1; }
          [ -f site/index.html ] || { echo "::error::the pages have no index.html"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site
          if-no-files-found: error
          retention-days: 7

  # Production: https://iainchesworthlabs.com/cubeulator/, from the branch site. The role, bucket and distribution come from
  # the repository secrets DOCS_ROLE_ARN, DOCS_BUCKET and DOCS_DISTRIBUTION_ID (set by the owner). The role's trust policy
  # allows a push to refs/heads/site of this repository (publishRef 'site' for cubeulator in icl-site). To publish the same
  # commit again, re-run the run of that push.
  deploy:
    name: Deploy site
    needs: assemble
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      prefix: cubeulator
      production-ref: refs/heads/site
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  # A denied role assumption would otherwise be one red step among many. Say what it means and what to do.
  deploy-failed:
    name: Explain a failed deploy
    needs: deploy
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say what to check
        shell: bash
        run: |
          set -euo pipefail
          message="The production docs deploy failed. If the step 'Assume the production role' says the web identity token cannot be assumed or the action is not authorized, the deploy role's trust policy does not allow a push to refs/heads/site of this repository: check that the cubeulator entry of icl-site (infra/lib/apps.ts) has publishRef site and has been deployed (the deploy-infra workflow of icl-site), that this repository's OIDC subject claim is customised the way the other apps' are (keys repo, context, event_name), and that the secrets DOCS_ROLE_ARN, DOCS_PREVIEW_ROLE_ARN, DOCS_BUCKET and DOCS_DISTRIBUTION_ID are set on this repository. Then re-run this run (Actions, Docs, the run of the push to site, Re-run all jobs). If another step failed, read its log. The site stays at its last good version."
          echo "::error title=Docs deploy failed::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Preview of a pull request from this repository, at https://iainchesworthlabs.com/_preview/cubeulator/pr-<n>/.
  preview:
    name: Deploy preview
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      prefix: cubeulator
      preview: true
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  remove-preview:
    name: Remove preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      mode: remove-preview
      prefix: cubeulator
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}
