name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      # The site carries the web app (docs/web.md), so what builds it
      # republishes the site as well.
      - ".github/actions/web-build/**"
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
  workflow_dispatch:
  # Called by ios-test-site.yml to publish the iPhone test build with the site
  # (docs/ios-install.md): `ref` is the revision whose documentation and web app the
  # site is made of, so that a publish from a work branch does not replace the
  # released site with unreleased pages.
  workflow_call:
    inputs:
      ref:
        description: The revision to build the site from (empty: the one that ran).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The browser build is its own job: it is the slow one (vcpkg builds OpenCV
  # for WebAssembly), and the documentation does not need it to render.
  web:
    runs-on: ubuntu-26.04
    env:
      VCPKG_MAX_CONCURRENCY: "4"
    steps:
      # fetch-depth: 0 for vcpkg's version resolution - see ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: $/.github/actions/vcpkg-cache/restore
        with:
          triplet: wasm32-emscripten-threads

      - name: Build the web app
        uses: $/.github/actions/web-build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cubeulator-web
          path: build/web-emscripten-release/bin
          if-no-files-found: error

      - name: Save vcpkg binaries
        if: ${{ always() }}
        uses: $/.github/actions/vcpkg-cache/save
        with:
          triplet: wasm32-emscripten-threads
          restored: ${{ steps.vcpkg-cache.outputs.listing }}

  build:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To fetch the iPhone test build from the run that made it (below).
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install mkdocs-material
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      # The app goes under /app/ of the site, which is where docs/web.md links.
      # It is static files; GitHub Pages serves .wasm as application/wasm. The
      # app cannot get the response headers threads need from Pages, so it
      # brings its own service worker for that (cubeulator-isolation.js) - and
      # because that worker's scope is the directory it is served from, it
      # affects nothing outside /app/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cubeulator-web
          path: site/app

      # The iPhone test build (docs/ios-install.md): the .ipa and manifest.plist of
      # the workflow run named by the repository variable IOS_TEST_RUN_ID, in a
      # folder named by the secret IOS_TEST_PATH (32 or more random hex digits; a secret
      # so that the public logs mask it) that nothing links to; the artifact brings its own page that makes the install link. A Pages deployment
      # replaces the whole site, so every publish, this workflow's own included,
      # carries the files for as long as the variable is set; unsetting
      # IOS_TEST_RUN_ID and publishing again takes them down, and so does the
      # run's artifact expiring (14 days). Nothing is committed to the repository.
      - name: Add the iPhone test build
        if: ${{ vars.IOS_TEST_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ vars.IOS_TEST_RUN_ID }}
          TEST_PATH: ${{ secrets.IOS_TEST_PATH }}
        run: |
          set -euo pipefail
          if [ -z "$TEST_PATH" ]; then echo "::warning::IOS_TEST_RUN_ID is set but the secret IOS_TEST_PATH is not (or is not passed to this workflow); the site is published without the iPhone test build."; exit 0; fi
          echo "::add-mask::$TEST_PATH"
          [[ "$TEST_PATH" =~ ^[0-9a-f]{32,}$ ]] || { echo "::error::IOS_TEST_PATH must be 32 or more hex digits"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::IOS_TEST_RUN_ID must be a run id"; exit 1; }
          mkdir -p "site/$TEST_PATH"
          if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n cubeulator-ios-adhoc -D "site/$TEST_PATH"; then
            ls "site/$TEST_PATH" | sed 's/^/  published: /'
          else
            echo "::warning::The iPhone test build of run $RUN_ID could not be fetched (its artifact expires after 14 days); the site is published without it."
            rm -rf "site/$TEST_PATH"
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
