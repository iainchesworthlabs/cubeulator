name: Release

# Builds the desktop packages (an installer for Windows, a disk image for macOS, a .deb and an .rpm for Linux), the
# web build's zip and the iPhone app (to TestFlight), then hands the packages to the shared publish workflow of
# icl-common-infra, which writes the SHA-512 manifest, signs, attests, checks the SBOMs and creates the GitHub Release.
# How to cut one is docs/releasing.md.
#
#   push a tag vX.Y.Z[-label.N]      ->  a release: verify, build, then publish. The tag is on a commit of develop. The
#                                        tag is pushed by the owner, or made by the `Tag a release` workflow with the
#                                        release bot's token (tag-release.yml). The publish job waits for the owner to
#                                        approve the `release` environment.
#   run by hand                      ->  a rehearsal of the packaging: build every package and the SBOMs, with Apple
#                                        validating the iPhone build, and publish nothing
#   a PR that changes the release    ->  only the tools' self-test runs, so that GitHub parses this file and a mistake
#   machinery                            shows before a tag does
#
# A final release (no label) also fast-forwards `main` to the tag, with the release bot, after it is published: `main`
# only ever holds a released commit (docs/branch-protection.md). Packages are not OS code-signed with a trusted
# certificate yet; the Windows files are test-signed when SIGN_WINDOWS is `test` (docs/packaging.md); what is signed
# for everyone is the SHA-512 manifest and every file, with the organisation's GPG key (docs/signing-key.asc), and each
# file carries a build-provenance attestation and an SBOM.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      ios:
        description: >-
          Build the iPhone app too; Apple validates the build and nothing is uploaded (a tag uploads it to TestFlight,
          docs/ios-install.md). Untick to rehearse the rest without a Mac and without the Apple secrets.
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/tag-release.yml"
      - "packaging/check-package.sh"
      - "tools/release/**"

# Nothing is granted by default. Each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # A release is never abandoned half way because another run started.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-26.04
    permissions:
      # actions and checks: check_health.py reads the commit's workflow runs
      # and check runs (read only).
      actions: read
      checks: read
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      publish: ${{ steps.mode.outputs.publish }}
      ios: ${{ steps.mode.outputs.ios }}
    steps:
      # The whole history, with the tags: whether the release commit sits on
      # develop needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A PR that changes the release machinery proves the file parses and the
      # tools still hold; the packages are built by ci.yml on that PR already.
      - name: Run the release tools' self-test
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: python3 tools/release/test_release_tools.py

      - name: Decide what this run is
        id: mode
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IOS_INPUT: ${{ inputs.ios }}
        run: |
          publish=false
          pushed_tag=""
          ios=true
          if [ "$EVENT" = "push" ]; then
            # A tag was pushed: the tag is the release.
            publish=true
            pushed_tag="$REF_NAME"
          fi
          # A tag push builds iOS whatever was ticked: the release is not the
          # place to leave a platform out by accident. Only a rehearsal can.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$IOS_INPUT" = "false" ]; then
            ios=false
          fi
          {
            echo "publish=$publish"
            echo "pushed_tag=$pushed_tag"
            echo "ios=$ios"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT publish=$publish ios=$ios tag=${pushed_tag:-<none: a rehearsal>}"

      # The version is the one CMakeLists.txt declares; the tag, the changelog
      # section and the package names must all agree with it
      # (tools/release/check_release.py says why for each).
      - name: Check the tree and the tag
        id: check
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          PUSHED_TAG: ${{ steps.mode.outputs.pushed_tag }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          args=()
          if [ -n "$PUSHED_TAG" ]; then args+=(--tag "$PUSHED_TAG"); fi
          if [ "$PUBLISH" != "true" ]; then args+=(--dry-run); fi
          python3 tools/release/check_release.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

      # A release is cut from develop, and `main` follows it afterwards (final
      # releases only). The shared publish workflow checks the same; failing
      # here saves the builds.
      - name: Check where the release is cut from
        if: ${{ github.event_name != 'pull_request' && steps.mode.outputs.publish == 'true' }}
        shell: bash
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git fetch --no-tags origin develop
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "::error::$TAG does not point at a commit on develop ($GITHUB_SHA is not). Releases are cut from develop."
            exit 1
          fi
          echo "$TAG may be released from $GITHUB_SHA."

      # The README shows a badge for each of CI, CodeQL, OSV-Scanner and
      # Zizmor; a release whose commit is not green on all of them is a red
      # front page. If the commit is a merge commit, it is the develop tip it
      # merged that is judged (--through-merge): that is what was tested. A
      # rehearsal reports and goes on; a release stops.
      - name: Check the commit is green
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          status=0
          python3 tools/release/check_health.py \
            --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_SHA" --through-merge \
            --summary "$GITHUB_STEP_SUMMARY" || status=$?
          if [ "$status" -ne 0 ] && [ "$PUBLISH" != "true" ]; then
            echo "::warning::The commit is not green. A release would stop here; a rehearsal goes on."
            exit 0
          fi
          exit "$status"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    # A PR that only touches the release machinery proves the workflow parses
    # and the verify job's logic runs; building three platforms for that is not
    # needed (build-and-test in ci.yml builds and checks the packages on that
    # PR).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # See the same cap, and why, on build-and-test in ci.yml.
    env:
      VCPKG_MAX_CONCURRENCY: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025-vs2026
            preset: windows-msvc-release
            triplet: x64-windows
            generators: NSIS
            artifact: windows-x64
          - name: macOS
            os: macos-26
            preset: macos-clang-release
            triplet: arm64-osx
            generators: DragNDrop
            artifact: macos-arm64
          - name: Linux
            # Built on 24.04, the oldest system the package is for (glibc 2.39). A build on a newer
            # runner links against the newest symbol versions of its glibc, and the first beta did not
            # start on 24.04 or Debian 13 for that reason (acosf, atan2f and sqrtf at GLIBC_2.43).
            os: ubuntu-24.04
            preset: linux-gcc-release
            triplet: x64-linux
            generators: "DEB;RPM"
            artifact: linux-x64

    steps:
      # fetch-depth: 0 so the version header can name the nearest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read-only: a release run restores the cache CI built and never writes
      # one, so that nothing a release run does can end up in what the other
      # workflows trust. A cold cache only costs time.
      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
        with:
          cache-key-suffix: ${{ matrix.triplet }}

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@16e8153a8b4918849d92aad131befe67a3705daa # v4.5.0
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      # GCC 16 is installed, not shipped: see the comment on ci.yml's
      # build-and-test job.
      # 24.04 carries GCC 14; the shared action adds the toolchain PPA for the GCC 16 pinned in
      # .github/toolchain-versions.json.
      - name: Install GCC 16 (Linux)
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30

      - name: Install vcpkg build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev autoconf autoconf-archive automake libtool libltdl-dev libxtst-dev

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm fakeroot desktop-file-utils appstream

      # makensis has to be present at configure time: cmake/Packaging.cmake
      # looks for it then.
      #
      # Chocolatey's community feed answers 504 Gateway Timeout now and then,
      # and a release build is too long to lose to it, so the installed
      # directory is restored from the cache ci.yml saves (and why: see there).
      # RESTORE-ONLY: a release run never writes a cache that another workflow
      # trusts, the policy the vcpkg binary cache follows. A miss costs a
      # Chocolatey install, with retries, as it always did.
      - name: Restore NSIS (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-3.13.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          $usable = [bool](Get-Command makensis -ErrorAction SilentlyContinue)
          if (-not $usable -and (Test-Path $makensis)) {
            # From the cache: prove it runs where it is, or install it properly.
            & $makensis /VERSION
            if ($LASTEXITCODE -eq 0) {
              $usable = $true
            } else {
              Write-Warning "the cached NSIS does not run; installing it from Chocolatey"
              Remove-Item -Recurse -Force (Split-Path $makensis)
            }
          }
          if (-not $usable) {
            foreach ($attempt in 1..4) {
              choco install nsis --version 3.13.0 --no-progress -y
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 4) { throw "choco install nsis failed four times" }
              Write-Warning "choco install nsis failed (attempt $attempt of 4)"
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          # CPack finds makensis on PATH, and failing that in the registry
          # value NSIS's own installer writes. A restored directory brings
          # neither, so say where it is for the steps that follow (see ci.yml:
          # without this a cache hit fails at the Package step with "Cannot
          # find NSIS compiler makensis", after the build has passed).
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $dir = Split-Path $makensis
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          makensis /VERSION

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The same Qt as ci.yml's legs, installed the same way (and see there why
      # Windows takes aqtinstall from a pinned commit): a release ships what CI
      # tested.
      - name: Install Qt (prebuilt)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.12.0"
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7' || '' }}
          modules: "qtquick3d qtshadertools"
          cache: true

      # The tests are not shipped, so neither they nor Catch2 are built.
      #
      # Configuring is where vcpkg builds the dependencies, so it is where a
      # download from github.com that answers 500 (it did, once, on the macOS
      # leg of the first dry run: an OpenCV patch) fails a job that has
      # otherwise done nothing wrong. vcpkg retries a download itself, and what
      # a failed attempt had built is in the binary cache and its buildtrees, so
      # a second attempt resumes rather than starts again.
      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          EXTRA_CXX_COMPILER: ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER=g++-16' || '' }}
        run: |
          for attempt in 1 2 3; do
            if cmake --preset "$CMAKE_PRESET" -DCUBEULATOR_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" $EXTRA_CXX_COMPILER; then
              exit 0
            fi
            echo "::warning::configure failed (attempt $attempt of 3)"
            sleep 30
          done
          echo "::error::configure failed three times"
          exit 1

      - name: Build
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$CMAKE_PRESET"

      # Authenticode, behind the SIGN_WINDOWS repository variable (false, test or production;
      # icl-common-infra docs/test-signing.md). The program is signed before CPack so that the
      # installer carries a signed program, and the installer after it. `rename: false`: the
      # package keeps the name docs and checks use, whatever the mode; the notes say what it is.
      - name: Sign the program (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: build/${{ matrix.preset }}/bin/Cubeulator.exe
          rename: "false"
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      - name: Package
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          PACKAGE_GENERATORS: ${{ matrix.generators }}
        # CPack writes the package to the directory it is run from, the
        # workspace root.
        run: cpack --config "build/${CMAKE_PRESET}/CPackConfig.cmake" -G "${PACKAGE_GENERATORS}"

      - name: Sign the installer (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: Cubeulator-${{ needs.verify.outputs.version }}-windows-x64.exe
          rename: "false"
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      # The same assertions CI makes on every push: Qt, the icon, the
      # identifier, the notices. A release that fails them is not published.
      - name: Check the package contents
        shell: bash
        run: packaging/check-package.sh .

      # The floor of the package: it has to start on Ubuntu 24.04 and Debian 13 (glibc 2.39, GCC 14's
      # libstdc++). The package job below starts the program on this runner, which is that system, but a
      # build on a newer one passes there and fails everywhere older, so the symbols are read directly.
      - name: Unpack the .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: dpkg-deb -x Cubeulator-*-linux-x64.deb "$RUNNER_TEMP/deb"

      - name: Check the glibc the package needs (Linux)
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/check-glibc-floor@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
        with:
          folder: ${{ runner.temp }}/deb

      - name: Check the libstdc++ the package needs (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/linux/check-libstdcxx-floor.sh "$RUNNER_TEMP/deb"

      # What the package holds, for the SBOM (tools/release/make_sbom.py): the
      # build's own inventory of what it linked and deployed, which it refuses
      # to package without resolving (docs/licensing.md).
      - name: Keep the third-party inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-${{ matrix.artifact }}
          path: build/${{ matrix.preset }}/third_party_notices/third-party-notices.json
          if-no-files-found: error

      # The shared publish workflow takes every artifact named release-*.
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: |
            Cubeulator-*.exe
            Cubeulator-*.dmg
            Cubeulator-*.deb
            Cubeulator-*.rpm
          if-no-files-found: error

  # The iPhone app: the Qt app for iOS (arm64) built by Xcode on a hosted Mac,
  # signed for the App Store with the organisation's Apple Distribution
  # certificate and this repository's App Store provisioning profile, and sent
  # to TestFlight. The build, the signing and their checks are
  # .github/workflows/ios-device.yml, which the maintainer also runs by hand;
  # this calls it so that the build testers get is the release's. A real
  # release uploads it; a rehearsal only has Apple validate it. With
  # SIGN_IOS_UPLOAD unset the app is built unsigned and nothing is sent. The
  # IPA is not a release file: an App Store IPA installs on no device
  # (docs/ios-install.md). The secrets are named here, one by one, and not
  # inherited. Holding Apple's signing material, it has no other permission.
  ios:
    name: Build the iOS app
    needs: verify
    if: ${{ github.event_name != 'pull_request' && needs.verify.outputs.ios == 'true' }}
    permissions:
      contents: read
    # The `$/` self-repository form is not accepted for a reusable workflow
    # (actionlint rejects it; GitHub documents only this path form here).
    uses: ./.github/workflows/ios-device.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.verify.outputs.version }}
      upload: ${{ needs.verify.outputs.publish == 'true' }}
      save_cache: false
    secrets:
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

  # The browser build: Qt and OpenCV for WebAssembly, as one directory of static
  # files, zipped with the licence, the notices and a note on hosting it
  # (packaging/web/). It is the same site docs.yml publishes under /app/, built
  # the same way (.github/actions/web-build), so that what a person is told to
  # try online and what they download to host are one thing.
  web:
    name: Build the web app
    needs: verify
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # See the same cap, and why, on the Web leg of ci.yml.
    env:
      VCPKG_MAX_CONCURRENCY: "4"
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # fetch-depth: 0 so the version header can name the nearest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read-only, as the desktop legs: see there.
      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
        with:
          cache-key-suffix: wasm32-emscripten-threads

      - name: Build the web app
        uses: $/.github/actions/web-build

      - name: Package
        shell: bash
        run: packaging/web/make-package.sh build/web-emscripten-release "$VERSION" dist-web

      # The same assertions on every release of the site: the files the page
      # loads, a module that is WebAssembly and threaded, the licence and the
      # notices.
      - name: Check the package contents
        shell: bash
        run: packaging/web/check-package.sh "dist-web/Cubeulator-${VERSION}-web.zip"

      # What the package holds, for the SBOM (tools/release/make_sbom.py).
      - name: Keep the third-party inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-web
          path: build/web-emscripten-release/third_party_notices/third-party-notices.json
          if-no-files-found: error

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist-web/Cubeulator-*-web.zip
          if-no-files-found: error

  # The bills of materials: what is INSIDE each package, per platform, from the build's own inventory
  # (tools/release/make_sbom.py), not what a scan of an installer sees. The CycloneDX file is the same bill of materials
  # reshaped from the SPDX document, for the scanners that read that format; the two cannot disagree. They go to the
  # publish workflow as an artifact named release-*, so they are lines of the SHA-512 manifest, under the same GPG
  # signature as the packages, and attested.
  sbom:
    name: Make the SBOMs
    needs: [verify, build, web]
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.verify.result == 'success' && needs.build.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/files

      - name: Check there is one package per platform
        shell: bash
        run: |
          cd dist/files
          ls -l
          # Exactly one package per platform, named for this version, or something is wrong.
          patterns=("Cubeulator-${VERSION}-windows-x64.exe" "Cubeulator-${VERSION}-macos-arm64.dmg"
                    "Cubeulator-${VERSION}-linux-x64.deb" "Cubeulator-${VERSION}-linux-x64.rpm"
                    "Cubeulator-${VERSION}-web.zip")
          for pattern in "${patterns[@]}"; do
            n=$(find . -maxdepth 1 -name "$pattern" | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "::error::expected one $pattern, found $n"
              exit 1
            fi
          done
          n=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$n" -ne "${#patterns[@]}" ]; then
            echo "::error::expected ${#patterns[@]} files, found $n"
            exit 1
          fi

      - name: Download the third-party inventories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: notices-*
          path: inventory

      - name: Make the SBOMs (SPDX and CycloneDX)
        shell: bash
        run: |
          mkdir -p sbom
          notices=(--notices windows=inventory/notices-windows-x64/third-party-notices.json
                   --notices macos=inventory/notices-macos-arm64/third-party-notices.json
                   --notices linux=inventory/notices-linux-x64/third-party-notices.json
                   --notices web=inventory/notices-web/third-party-notices.json)
          python3 tools/release/make_sbom.py \
            --version "$VERSION" --tag "$TAG" --repo "$REPO" --files dist/files \
            "${notices[@]}" \
            --output "sbom/Cubeulator-${VERSION}.spdx.json" \
            --cyclonedx-output "sbom/Cubeulator-${VERSION}.cdx.json"

      - name: Keep the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: sbom/*
          if-no-files-found: error
          retention-days: 7

  # Everything between "the packages exist" and "a release exists" is the shared workflow of icl-common-infra
  # (release-publish.yml): the SHA-512 manifest, the GPG signatures (checked against docs/signing-key.asc), the
  # provenance and SBOM attestations (read back), the notes and the GitHub Release; and, for a final release, the
  # fast-forward of `main`. Its publish job waits for the owner to approve the `release` environment. The project's
  # part is the notes, which are the ones every release of this project has had (tools/release/render_release_notes.py).
  # The public key is not in the release: it is docs/signing-key.asc in the repository, the key every signature is
  # checked against.
  publish:
    name: Publish
    needs: [verify, build, web, ios, sbom]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.verify.result == 'success' && needs.build.result == 'success' && needs.web.result == 'success' && needs.sbom.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.ios.result) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      generate-sbom: false
      spdx-sbom: Cubeulator-${{ needs.verify.outputs.version }}.spdx.json
      cyclonedx-sbom: Cubeulator-${{ needs.verify.outputs.version }}.cdx.json
      notes-script: tools/release/render-notes.sh
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
