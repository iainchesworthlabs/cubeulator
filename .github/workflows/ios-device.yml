name: iOS device build

# The Qt app as an iPhone application (arm64), built by Xcode on a hosted Mac:
# the build for the maintainer's own devices, not a store build
# (docs/ios-install.md). Run by hand:
#
#   gh workflow run ios-device.yml --ref <branch> [-f release_tag=<tag>]
#
# With the five Apple secrets set (docs/ios-install.md) the app is signed with
# the Apple Distribution certificate and an ad-hoc provisioning profile and
# packed into an .ipa with an over-the-air install manifest.plist; with no
# profile it is built unsigned, which proves the build and nothing else. A
# profile without the certificate or the team is an error, so that a forgotten
# secret is not a quietly unsigned build.
#
# The library leg of CI (ios-build) compiles only cube::lib, without Qt. This one
# builds the whole app against Qt's static iOS kit, so it is where a missing
# static plugin or an unresolved symbol shows up.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          The GitHub release the .ipa and manifest.plist will be uploaded to by
          hand, which the manifest's download address names (default: the test folder
          of the documentation site when IOS_TEST_PATH is set, else v<version>).
          The workflow uploads nothing to it.
        type: string
        default: ""
  # GitHub can dispatch a workflow only from the default branch (main), which a
  # change to this build reaches last, so a push to a branch of the iOS work runs
  # it. Branches with any other name do not cost a Mac.
  push:
    branches: ["feature/ios-**", "bugfix/ios-**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-device:
    name: iOS device (arm64)
    # macos-15, not macos-26, for the reason on CI's ios-build job: libwebp's
    # arm64-ios build fails vcpkg_fixup_pkgconfig on macos-26 (vcpkg#50681).
    runs-on: macos-15
    timeout-minutes: 180
    # Caps vcpkg's build parallelism, as on the other legs (opencv4 builds here).
    env:
      VCPKG_MAX_CONCURRENCY: "2"
      BUNDLE_ID: com.iainchesworthlabs.cubeulator
    steps:
      # fetch-depth: 0 and the submodule: vcpkg's version resolution reads
      # historical trees of deps/vcpkg (see CI's build legs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Before a Qt download of several gigabytes: which of the five secrets are
      # set, by name; the values are never printed. All five sign; none builds
      # unsigned; anything between is a mistake and says which are missing.
      - name: Decide whether to sign
        id: sign
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          missing=""
          set_count=0
          for name in IOS_DIST_CERTIFICATE_BASE64 IOS_DIST_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID APPLE_PROVISIONING_PROFILE_NAME; do
            if [ -n "${!name}" ]; then set_count=$((set_count + 1)); else missing="$missing $name"; fi
          done
          if [ "$set_count" -eq 5 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "All five Apple secrets are set: the build is signed."
          elif [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -z "$APPLE_PROVISIONING_PROFILE_NAME" ]; then
            # The certificate can be set long before the profile exists (the
            # profile needs the device and the App ID): that is a build, not a fault.
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build::No provisioning profile is set, so the app is built but not signed. Not set:$missing. docs/ios-install.md."
          else
            echo "::error title=iOS signing secrets incomplete::Repository secret(s) not set:$missing. Set all five to sign, or the two profile secrets last. docs/ios-install.md."
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          base="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)"
          label="$(sed -nE 's/^set\(CUBEULATOR_VERSION_PRERELEASE "([^"]*)"\).*/\1/p' CMakeLists.txt | head -n 1)"
          [ -n "$base" ] || { echo "::error::no project VERSION found in CMakeLists.txt"; exit 1; }
          full="$base${label:+-$label}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "version $full (the bundle's is $base)"

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache/restore
        with:
          triplet: arm64-ios

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      # Qt's iOS kit (static), and the macOS kit that aqtinstall's --autodesktop
      # installs beside it for the host tools a cross build runs (moc, rcc,
      # qmlcachegen, shader baking). The aqtinstall pin is the Windows leg's: the
      # last release predates the Qt 6.11+ repository layout.
      - name: Install Qt (iOS kit and macOS host kit)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          host: mac
          target: ios
          arch: ios
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          modules: "qtquick3d qtshadertools"
          cache: false

      # Where the action put the two kits, which the preset reads (the runner
      # context is not available in a job-level env).
      - name: Name the Qt kits
        run: |
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/6.12.0/ios" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/6.12.0/macos" >> "$GITHUB_ENV"

      - name: Show the toolchain
        run: |
          cmake --version | head -n 1
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for kit in "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" "$QT_HOST_PATH/lib/cmake/Qt6/Qt6Config.cmake"; do
            [ -e "$kit" ] || { echo "::error::$kit is not there: the Qt install put its kits somewhere else (look at the install step's log)"; ls "$RUNNER_TEMP/Qt" "$RUNNER_TEMP/Qt/6.12.0" || true; exit 1; }
          done

      # The distribution certificate goes into a keychain made for this job (never
      # the runner's login keychain) and the profile where Xcode looks for it, by
      # its UUID. The profile is checked against the secrets before anything is
      # built, so a stale or mismatched one says so here and not as an Xcode error
      # an hour in. Only counts and names are printed, never a device or a secret.
      - name: Import the signing certificate and the provisioning profile
        if: steps.sign.outputs.signed == 'true'
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/cubeulator-ios.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "IOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$IOS_DIST_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/cubeulator.mobileprovision"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # The certificate's issuer, Apple's G3 intermediate, so that the chain to
          # Apple's root can be built (the runner image may not carry it).
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          openssl x509 -inform DER -in "$RUNNER_TEMP/wwdr.cer" -noout -subject | grep -q 'Apple Worldwide Developer Relations'
          security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/wwdr.cer"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046  # the existing list is words without spaces
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v -p codesigning "$keychain" | grep -c 'Apple Distribution' || true)"
          if [ "$identities" -lt 1 ]; then
            echo "::error title=No Apple Distribution certificate::IOS_DIST_CERTIFICATE_BASE64 holds no 'Apple Distribution' identity with its private key (or IOS_DIST_CERTIFICATE_PASSWORD is wrong). Export the certificate from Keychain Access as a .p12 including its private key, and base64 it."
            exit 1
          fi

          profile="$RUNNER_TEMP/cubeulator.mobileprovision"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          uuid="$(pb UUID)"
          name="$(pb Name)"
          team="$(pb TeamIdentifier:0)"
          appid="$(pb Entitlements:application-identifier)"
          expires="$(plutil -extract ExpirationDate raw -o - "$RUNNER_TEMP/profile.plist")"
          devices="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -c '^    ' || true)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          fail() { echo "::error title=Provisioning profile does not fit::$*"; exit 1; }
          [ "$name" = "$APPLE_PROVISIONING_PROFILE_NAME" ] || fail "The profile in IOS_PROVISIONING_PROFILE_BASE64 is named '$name', but APPLE_PROVISIONING_PROFILE_NAME says '$APPLE_PROVISIONING_PROFILE_NAME'. Set the secret to the profile's name exactly as the Apple developer portal shows it."
          [ "$team" = "$APPLE_TEAM_ID" ] || fail "The profile belongs to team $team, but APPLE_TEAM_ID is $APPLE_TEAM_ID."
          [ "$appid" = "$team.$BUNDLE_ID" ] || fail "The profile is for '$appid', not $team.$BUNDLE_ID. Make an ad-hoc profile for the App ID $BUNDLE_ID."
          [ "$devices" -gt 0 ] || fail "The profile lists no devices, so it is not an ad-hoc profile (a store profile cannot install on a device)."
          [[ "$expires" > "$now" ]] || fail "The profile expired on $expires. Regenerate it in the Apple developer portal and set IOS_PROVISIONING_PROFILE_BASE64 again."

          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          cp "$profile" "$dir/$uuid.mobileprovision"
          echo "IOS_PROFILE_FILE=$dir/$uuid.mobileprovision" >> "$GITHUB_ENV"
          echo "profile '$name' (team $team) lists $devices device(s) and expires $expires"

      # Unsigned for every target but the application: the preset turns signing off
      # project-wide, and the two cache variables turn it on for the application
      # alone (packaging/ios/ConfigureApp.cmake says why).
      - name: Configure
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          args=(-DCUBEULATOR_IOS_BUILD_NUMBER="$GITHUB_RUN_NUMBER")
          if [ "$SIGNED" = true ]; then
            args+=(-DCUBEULATOR_IOS_SIGNING_TEAM="$APPLE_TEAM_ID" -DCUBEULATOR_IOS_SIGNING_PROFILE="$APPLE_PROVISIONING_PROFILE_NAME")
          fi
          cmake --preset ios-device-release "${args[@]}"

      - name: Build
        run: cmake --build --preset ios-device-release

      # Saved even when a later step fails: otherwise a red leg throws away every
      # package vcpkg had already built.
      - name: Save vcpkg binaries
        if: ${{ always() }}
        uses: ./.github/actions/vcpkg-cache/save
        with:
          triplet: arm64-ios
          restored: ${{ steps.vcpkg-cache.outputs.listing }}

      # The built application, opened as a user's device would: identifier,
      # version, the camera text, the icon, arm64, nothing linked outside the
      # system, and when signed the signature and an ad-hoc profile.
      - name: Find and check the application
        id: app
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          VERSION: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          # CMAKE_RUNTIME_OUTPUT_DIRECTORY is <build>/bin, and Xcode adds the configuration.
          app="build/ios-device-release/bin/Release/Cubeulator.app"
          [ -d "$app" ] || { echo "::error::no Cubeulator.app was built at $app"; find build/ios-device-release -name '*.app' -maxdepth 4 || true; exit 1; }
          echo "path=$app" >> "$GITHUB_OUTPUT"
          if [ "$SIGNED" = true ]; then flag=--signed; else flag=; fi
          # shellcheck disable=SC2086  # $flag is one word or nothing
          bash packaging/ios/verify_ipa.sh "$app" --version "$VERSION" $flag

      # An .ipa is the application in a Payload folder, zipped. ditto keeps what a
      # signed bundle must keep (symlinks, permissions, extended attributes).
      - name: Make the IPA and its install manifest
        if: steps.sign.outputs.signed == 'true'
        env:
          APP: ${{ steps.app.outputs.path }}
          FULL: ${{ steps.version.outputs.full }}
          BASE: ${{ steps.version.outputs.base }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          # A secret, not a variable: the logs of a public repository are public,
          # and a secret's value is masked in them.
          TEST_PATH: ${{ secrets.IOS_TEST_PATH }}
        run: |
          set -euo pipefail
          ipa="Cubeulator-$FULL-ios-adhoc.ipa"
          # Where the .ipa will be served from. A test build is served by the
          # documentation site from an unlisted folder (the repository variable
          # IOS_TEST_PATH, docs/ios-install.md); a release names its own asset.
          if [ -n "$TEST_PATH" ] && [ -z "$RELEASE_TAG" ]; then
            where=(--base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$TEST_PATH")
          else
            where=(--repo "$GITHUB_REPOSITORY" --tag "${RELEASE_TAG:-v$FULL}")
          fi
          rm -rf stage ios-dist && mkdir -p stage/Payload ios-dist
          ditto "$APP" stage/Payload/Cubeulator.app
          (cd stage && ditto -c -k --keepParent Payload "../ios-dist/$ipa")
          bash packaging/ios/verify_ipa.sh "ios-dist/$ipa" --version "$BASE" --signed
          bash tools/release/make_ios_manifest.sh --out ios-dist/manifest.plist --ipa "$ipa" \
            "${where[@]}" --version "$BASE" --bundle-id "$BUNDLE_ID"
          plutil -lint ios-dist/manifest.plist
          # The page that makes the install link, for when the documentation site serves it.
          cp packaging/ios/test-install.html ios-dist/index.html
          ls -l ios-dist

      - name: Upload the IPA and its manifest
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cubeulator-ios-adhoc
          path: ios-dist/*
          if-no-files-found: error
          # The documentation site carries this artifact while IOS_TEST_RUN_ID names its
          # run (docs.yml), so this is also how long the test build can be published.
          retention-days: 14

      # Whatever happened above, the certificate and the profile do not stay on the
      # runner.
      - name: Remove the signing keychain and the provisioning profile
        if: ${{ always() }}
        run: |
          if [ -n "${IOS_KEYCHAIN:-}" ]; then security delete-keychain "$IOS_KEYCHAIN" || true; fi
          if [ -n "${IOS_PROFILE_FILE:-}" ]; then rm -f "$IOS_PROFILE_FILE"; fi
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/cubeulator.mobileprovision" "$RUNNER_TEMP/profile.plist"
