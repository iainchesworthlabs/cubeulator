name: iOS device build

# The Qt app as an iPhone application (arm64), built by Xcode on a hosted Mac. With
# SIGN_IOS_UPLOAD=true it is signed with the Apple Distribution certificate and an App
# Store provisioning profile, exported as an App Store IPA and checked by Apple; a
# release also uploads it to TestFlight (docs/ios-install.md, docs/ios-signing.md).
# With the variable unset it is built unsigned, which proves the build and nothing else.
#
# Three ways in:
#   * release.yml calls it (workflow_call) for a release:
#       with:    version (full, e.g. 0.2.0-beta.2), upload (true: upload to TestFlight;
#                false: Apple validates the build and makes none), save_cache (false: a
#                release only reads the cache)
#       secrets: the six Apple ones, passed explicitly
#       permissions: contents: read
#     and takes the artifact `notices-ios` (third-party-notices.json, the build's own
#     inventory). The IPA goes to TestFlight and is not kept anywhere else: an
#     App Store IPA installs on no device, and a workflow artifact of a public
#     repository can be downloaded by any signed-in GitHub account.
#   * by hand: gh workflow run ios-device.yml --ref <branch>  (only once this file
#     is on the default branch: GitHub dispatches only workflows that are on it)
#   * a push to a feature/ios-* or bugfix/ios-* branch, which is how the work on the
#     build is tried before that.
#
# A push or a dispatch never uploads: TestFlight refuses a build number that is not
# higher than every earlier one for the version, and the number is the run number of
# release.yml, which is the one counter that uploads.
#
# The library leg of CI (ios-build) compiles only cube::lib, without Qt. This one
# builds the whole app against Qt's static iOS kit, so it is where a missing
# static plugin or an unresolved symbol shows up.

on:
  workflow_call:
    inputs:
      version:
        description: "The full version (empty: read from CMakeLists.txt, which it must equal)."
        type: string
        default: ""
      upload:
        description: "Upload the build to TestFlight. Without it Apple only validates the build."
        type: boolean
        default: false
      save_cache:
        description: "Save the vcpkg binary cache (a release only restores it)."
        type: boolean
        default: false
    secrets:
      IOS_DIST_CERT_P12_BASE64:
        required: false
      IOS_DIST_CERT_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      APPSTORE_API_KEY_ID:
        required: false
      APPSTORE_API_ISSUER_ID:
        required: false
      APPSTORE_API_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      offsets:
        description: >-
          Image offsets (decimal, space separated) from a TestFlight crash log, frames of the
          Cubeulator image: they are named from this build, and its UUID is shown to compare
          with the crash's slice_uuid. Leave empty for an ordinary build.
        type: string
        default: ""
  # GitHub can dispatch a workflow only from the default branch, which a change to
  # this build reaches last, so a push to a branch of the iOS work runs it.
  # Branches with any other name do not cost a Mac.
  push:
    branches: ["feature/ios-**", "bugfix/ios-**"]

# A literal group: in a called workflow ${{ github.workflow }} is the caller's, and a
# group shared with the caller's own would make the two wait for each other. Only
# this file's own push runs are superseded; a release's build is never cancelled.
concurrency:
  group: ios-device-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.workflow == 'iOS device build' }}

permissions:
  contents: read

jobs:
  ios-device:
    name: iOS device (arm64)
    # macos-15, not macos-26, for the reason on CI's ios-build job: libwebp's
    # arm64-ios build fails vcpkg_fixup_pkgconfig on macos-26 (vcpkg#50681).
    runs-on: macos-15
    timeout-minutes: 180
    # Caps vcpkg's build parallelism, as on the other legs (opencv4 builds here).
    env:
      VCPKG_MAX_CONCURRENCY: "2"
      BUNDLE_ID: com.iainchesworthlabs.cubeulator
      # The repository variable that turns signing on: the same one for every
      # project that builds for TestFlight.
      SIGNED: ${{ vars.SIGN_IOS_UPLOAD == 'true' }}
    steps:
      # fetch-depth: 0 so the version header can name the nearest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before a Qt download of several gigabytes: the action names the secret that
      # is missing. The certificate goes into a keychain made for this job (never
      # the runner's login keychain) and the profile where Xcode looks for it; the
      # profile is checked for the bundle identifier, for expiry and for being an
      # App Store one. Only counts and names are printed, never a secret.
      - name: Import the certificate and the provisioning profile
        id: signing
        if: env.SIGNED == 'true'
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          certificate-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          bundle-id: ${{ env.BUNDLE_ID }}
          method: app-store

      - name: Read the version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          base="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)"
          label="$(sed -nE 's/^set\(CUBEULATOR_VERSION_PRERELEASE "([^"]*)"\).*/\1/p' CMakeLists.txt | head -n 1)"
          [ -n "$base" ] || { echo "::error::no project VERSION found in CMakeLists.txt"; exit 1; }
          full="$base${label:+-$label}"
          if [ -n "$VERSION_INPUT" ] && [ "$VERSION_INPUT" != "$full" ]; then
            echo "::error::asked for version $VERSION_INPUT but CMakeLists.txt declares $full"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "version $full (the bundle's is $base)"

      # App Store Connect refuses a build made with an SDK older than iOS 26
      # ("SDK version issue", validation 409), and macos-15's default Xcode is 16.4
      # (iOS 18.5). The image carries Xcode 26 beside it, so this selects that and
      # keeps macos-15, whose pkgconf the vcpkg libwebp build needs (see the note
      # on the runner above). DEVELOPER_DIR is read by xcodebuild, by CMake's Xcode
      # generator and by the compiler wrappers, with no sudo and no xcode-select.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error title=No Xcode 26::This runner image has no /Applications/Xcode_26*.app, and Apple refuses builds made with an older SDK. Installed:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "using $xcode"

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          cache-key-suffix: arm64-ios

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      # Qt's iOS kit (static), and the macOS kit that aqtinstall's --autodesktop
      # installs beside it for the host tools a cross build runs (moc, rcc,
      # qmlcachegen, shader baking). The aqtinstall pin is the Windows leg's: the
      # last release predates the Qt 6.11+ repository layout.
      - name: Install Qt (iOS kit and macOS host kit)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          host: mac
          target: ios
          arch: ios
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          modules: "qtquick3d qtshadertools"
          cache: false

      # Where the action put the two kits, which the preset reads (the runner
      # context is not available in a job-level env).
      - name: Name the Qt kits
        run: |
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/6.12.0/ios" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/6.12.0/macos" >> "$GITHUB_ENV"

      - name: Show the toolchain
        run: |
          cmake --version | head -n 1
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for kit in "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" "$QT_HOST_PATH/lib/cmake/Qt6/Qt6Config.cmake"; do
            [ -e "$kit" ] || { echo "::error::$kit is not there: the Qt install put its kits somewhere else (look at the install step's log)"; ls "$RUNNER_TEMP/Qt" "$RUNNER_TEMP/Qt/6.12.0" || true; exit 1; }
          done

      # Unsigned for every target but the application: the preset turns signing off
      # project-wide, and the two cache variables turn it on for the application
      # alone (packaging/ios/ConfigureApp.cmake says why). The build number is the
      # run number: TestFlight wants it to grow with every upload.
      - name: Configure
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: |
          set -euo pipefail
          args=(-DCUBEULATOR_IOS_BUILD_NUMBER="$GITHUB_RUN_NUMBER")
          if [ "$SIGNED" = true ]; then
            args+=(-DCUBEULATOR_IOS_SIGNING_TEAM="$TEAM_ID" -DCUBEULATOR_IOS_SIGNING_PROFILE="$PROFILE_NAME")
          fi
          cmake --preset ios-device-release "${args[@]}"

      - name: Build
        run: cmake --build --preset ios-device-release

      # Names the frames of a crash log (docs/ios-signing.md, "Reading a TestFlight crash").
      # A crash log of a build from the store has no symbol names for this program, and
      # this build is the same code. The UUID has to equal the crash's slice_uuid for the
      # offsets to be exact; when it does not, the names are still close, because the
      # commit and branch name stamped in the program move data, not the code.
      - name: Name the frames of a crash log
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.offsets != '' }}
        env:
          OFFSETS: ${{ inputs.offsets }}
        run: |
          set -euo pipefail
          bin="build/ios-device-release/bin/Release/Cubeulator.app/Cubeulator"
          [ -f "$bin" ] || { echo "::error::no $bin"; exit 1; }
          echo "UUID of this build:"; xcrun dwarfdump --uuid "$bin"
          args=()
          for o in $OFFSETS; do
            # A return address points after the call, so look one byte before it.
            args+=("$(printf '0x%x' $((0x100000000 + o - 1)))")
          done
          i=0
          xcrun atos -o "$bin" -arch arm64 -l 0x100000000 "${args[@]}" | while IFS= read -r line; do
            set -- $OFFSETS
            shift "$i"
            echo "$1 $line"
            i=$((i + 1))
          done

      # What the third-party inventory made of the link line (docs/licensing.md): the
      # components it found and what it could not place. The release's SBOM refuses a
      # package whose inventory has anything unresolved.
      - name: Show the third-party inventory
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          json=build/ios-device-release/third_party_notices/third-party-notices.json
          [ -f "$json" ] || { echo "::warning::no $json"; exit 0; }
          python3 - "$json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print("keys:", sorted(d))
          print("unresolved:", len(d.get("unresolved", [])))
          for u in d.get("unresolved", [])[:20]:
              print("  -", str(u)[:200])
          kinds = {}
          for l in d.get("linked", []):
              kinds[l.get("kind")] = kinds.get(l.get("kind"), 0) + 1
          print("linked by kind:", kinds)
          PY

      # Saved even when a later step fails: otherwise a red leg throws away every
      # package vcpkg had already built.
      # Not in a release, which only restores it (the caller says so with save_cache;
      # github.workflow is the caller's name in a called workflow, so this file's own
      # runs are the ones that save).
      - name: Save vcpkg binaries
        if: ${{ always() && (inputs.save_cache == true || github.workflow == 'iOS device build') }}
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@e15f14812b7446517252d6677abf755698d57986 # v0.1.18

      # The built application, opened as a user's device would: identifier,
      # version, the camera text, the icon, arm64, nothing linked outside the
      # system, and when signed the signature and an App Store profile.
      - name: Find and check the application
        id: app
        env:
          VERSION: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          # CMAKE_RUNTIME_OUTPUT_DIRECTORY is <build>/bin, and Xcode adds the configuration.
          app="build/ios-device-release/bin/Release/Cubeulator.app"
          [ -d "$app" ] || { echo "::error::no Cubeulator.app was built at $app"; find build/ios-device-release -name '*.app' -maxdepth 4 || true; exit 1; }
          echo "path=$app" >> "$GITHUB_OUTPUT"
          args=(--version "$VERSION")
          if [ "$SIGNED" = true ]; then args+=(--signed --store); fi
          bash packaging/ios/verify_ipa.sh "$app" "${args[@]}"

      - name: Name the IPA
        id: ipa
        if: env.SIGNED == 'true'
        env:
          FULL: ${{ steps.version.outputs.full }}
        run: |
          set -euo pipefail
          project="$(find build/ios-device-release -maxdepth 1 -name '*.xcodeproj' | head -n 1)"
          [ -n "$project" ] || { echo "::error::CMake made no .xcodeproj under build/ios-device-release"; exit 1; }
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "path=ios-dist/Cubeulator-$FULL-ios-appstore.ipa" >> "$GITHUB_OUTPUT"

      # xcodebuild archive and the export, signed for the App Store with the
      # certificate and profile imported above. CMake made the scheme (the
      # preset sets CMAKE_XCODE_GENERATE_SCHEME); it is named for the target.
      - name: Archive and export the IPA
        id: export
        if: env.SIGNED == 'true'
        uses: iainchesworthlabs/icl-common-infra/actions/export-ios-ipa@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          project: ${{ steps.ipa.outputs.project }}
          scheme: cube_app
          bundle-id: ${{ env.BUNDLE_ID }}
          team-id: ${{ steps.signing.outputs.team-id }}
          profile-name: ${{ steps.signing.outputs.profile-name }}
          method: app-store
          output: ${{ steps.ipa.outputs.path }}

      - name: Check the IPA
        if: env.SIGNED == 'true'
        env:
          IPA: ${{ steps.export.outputs.ipa }}
          VERSION: ${{ steps.version.outputs.base }}
        run: bash packaging/ios/verify_ipa.sh "$IPA" --version "$VERSION" --signed --store

      # Apple's own check of the icon, the property list, the signature and the
      # privacy declarations; and, for a release, the upload to TestFlight.
      - name: Validate with Apple, and upload to TestFlight
        if: env.SIGNED == 'true'
        uses: iainchesworthlabs/icl-common-infra/actions/upload-testflight@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          ipa: ${{ steps.export.outputs.ipa }}
          key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          validate-only: ${{ inputs.upload != true }}

      # Qt's own SBOMs of the two kits, for tools/licences/qt_sbom_manifest.py: the
      # snapshot in third_party/notices/qt-modules.json has to know the iOS kit's
      # components. Only this file's own runs keep them.
      - name: Keep Qt's SBOMs
        if: ${{ github.workflow == 'iOS device build' && !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-sboms
          path: |
            ${{ runner.temp }}/Qt/6.12.0/ios/sbom
            ${{ runner.temp }}/Qt/6.12.0/macos/sbom
          if-no-files-found: warn
          retention-days: 7

      # The build's own inventory of what it contains (docs/licensing.md), which the
      # release's SBOM is made from.
      - name: Keep the third-party inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-ios
          path: build/ios-device-release/third_party_notices/third-party-notices.json
          if-no-files-found: warn
          retention-days: 14

      # Whatever happened above, the certificate and the profile do not stay on the
      # runner.
      - name: Remove the signing keychain and the provisioning profile
        if: ${{ always() && env.SIGNED == 'true' }}
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          remove: "true"
