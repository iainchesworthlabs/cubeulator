name: CodeQL

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue in front of develop (docs/branch-protection.md): Analyze
  # (C++) is one of the checks develop requires.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * 1"

# Nothing at the top level: the one job asks for what it needs.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # Same rule as ci.yml: a push to develop or main finishes, because it is the
  # run that stores the vcpkg cache pull requests restore from.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      contents: read
    # Caps vcpkg's internal build parallelism - see the equivalent comment
    # in ci.yml's build-and-test job (onnxruntime OOM'd this runner at full
    # nproc parallelism).
    env:
      VCPKG_MAX_CONCURRENCY: "2"

    steps:
      # fetch-depth: 0 so the version header can name the nearest tag.
      #
      # A merge-queue entry is not analysed at all (see the next step), so it does
      # not check out either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'merge_group' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      # Two cases are not analysed, and in both the job still runs and reports
      # `Analyze (C++)` as a success (a job skipped by `if` reports under the raw
      # text of its name, which for a required check is no report at all):
      #
      # - a draft pull request, or a change to documentation alone
      #   (.github/actions/changed-code);
      # - a merge-queue entry. Code scanning does not take results for a
      #   gh-readonly-queue ref: the upload fails with "CodeQL job status was
      #   configuration error", which turned the check red on the queue commit
      #   that develop then fast-forwards to (run 39540846415, 2026-10-21) and
      #   made tools/release/check_health.py say develop was not green. The pull
      #   request has been analysed already; the push to develop is analysed
      #   after the merge.
      - name: Does anything but documentation change?
        id: changed
        if: ${{ github.event_name != 'merge_group' }}
        uses: $/.github/actions/changed-code

      - name: Nothing to analyse in a merge-queue entry
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        run: echo "the pull request was analysed; a queue entry is not uploaded"


      # Keyed per vcpkg triplet (x64-linux), shared with ci.yml's Linux legs,
      # clang-tidy, and coverage jobs - all resolve the identical x64-linux
      # package set regardless of preset, so a single shared cache avoids
      # the wasteful per-preset duplication that pushed total cache usage
      # over GitHub's 10GB-per-repo cap (confirmed via the cache usage API).
      # actions/cache tolerates concurrent jobs racing to populate the same
      # key (whichever finishes first wins; the others just skip their own
      # save harmlessly).
      - name: Set up vcpkg
        if: ${{ steps.changed.outputs.code == 'true' }}
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          cache-key-suffix: x64-linux

      - name: Install CMake 4 + Ninja
        if: ${{ steps.changed.outputs.code == 'true' }}
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      # GCC 16 is installed, not shipped: see the comment on ci.yml's
      # build-and-test job.
      - name: Install GCC 16
        if: ${{ steps.changed.outputs.code == 'true' }}
        uses: $/.github/actions/install-gcc

      # vcpkg build gaps on ubuntu-26.04 - see the fuller comment on
      # build-and-test in ci.yml (X11/GL headers).
      - name: Install vcpkg build dependencies
        if: ${{ steps.changed.outputs.code == 'true' }}
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      # Sanitizers disabled: CodeQL's build tracer sets its own LD_PRELOAD for
      # the whole build step, which collides with ASan needing to be first in
      # the preload chain. CodeQL is pure static analysis and gets nothing
      # from ASan/UBSan being enabled here.
      - name: Configure (library + platform only, no Qt app)
        if: ${{ steps.changed.outputs.code == 'true' }}
        run: >
          cmake --preset linux-gcc-debug
          -DCMAKE_CXX_COMPILER=g++-16
          -DCUBEULATOR_BUILD_APP=OFF
          -DCUBEULATOR_ENABLE_SANITIZERS=OFF

      # Initialised AFTER the configure step above, which is where vcpkg builds
      # the dependencies (manifest mode installs them during configure).
      # CodeQL traces every compiler call from this step on, so anything vcpkg
      # compiled after it was analysed as if it were ours: when the binary
      # cache holds a different generation from the one the push needs (the
      # push to develop on 2026-10-18 restored 52 archives of 64 and rebuilt
      # libjpeg-turbo, OpenCV and the rest, and a scheduled run on main with a
      # cold cache rebuilt them all), the code-scanning tab filled with some
      # 380 "high" alerts in the vcpkg checkout's buildtrees/ that no one here can fix.
      - name: Initialize CodeQL
        if: ${{ steps.changed.outputs.code == 'true' }}
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: cpp
          build-mode: manual

      # Configured a second time, from scratch, under the tracer. The first
      # configure left the dependencies installed, so vcpkg has nothing to
      # build here; what the tracer needs is to see the compiler being run
      # (CMake's compiler checks), which a configure that is only re-read from
      # the cache does not do - with the tracer started after the one and only
      # configure, "CodeQL could not process any code written in C/C++".
      - name: Configure again under the tracer
        if: ${{ steps.changed.outputs.code == 'true' }}
        run: >
          cmake --fresh --preset linux-gcc-debug
          -DCMAKE_CXX_COMPILER=g++-16
          -DCUBEULATOR_BUILD_APP=OFF
          -DCUBEULATOR_ENABLE_SANITIZERS=OFF

      - name: Build
        if: ${{ steps.changed.outputs.code == 'true' }}
        run: cmake --build --preset linux-gcc-debug

      - name: Perform CodeQL Analysis
        if: ${{ steps.changed.outputs.code == 'true' }}
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:cpp"

      # Saved even when a later step fails: otherwise a red leg throws away every
      # package vcpkg had already built and the next attempt starts from nothing
      # (an hour or more on Windows and macOS). Only saves when packages were
      # added since the restore - see save-vcpkg-cache in icl-common-infra.
      - name: Save vcpkg binaries
        if: ${{ steps.changed.outputs.code == 'true' && (always()) }}
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
