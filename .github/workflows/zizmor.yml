name: Zizmor

# Static analysis of the workflow YAML itself (script injection via
# untrusted inputs, overly-broad permissions, unpinned actions, etc.).
# Visible-only (continue-on-error on the scan step): findings land in the
# Security > Code scanning tab but don't block merges.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "50 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Analyze workflows
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The version is pinned in ci/requirements-zizmor.txt, which
      # Dependabot's pip ecosystem for /ci keeps current.
      - name: Run zizmor
        continue-on-error: true
        run: uv run --no-project --with-requirements ci/requirements-zizmor.txt -- zizmor --format=sarif . > results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: zizmor
