name: Fuzz

# The mutation runs of the fuzz harnesses in src/lib/fuzz (docs/testing.md, "Fuzzing").
# Replaying the seeds and the regressions is not here: ctest does that in every test run,
# under the sanitizers of the preset, as the tests labelled `fuzz` (ci.yml's clang-tidy leg
# runs them on every pull request).
#
#   fuzz-short    on a push to develop: every harness for 60 seconds, from its seeds and
#                 the corpus of the last night.
#   fuzz-nightly  once a day: every harness for 10 minutes (more by dispatch), from the
#                 corpus the night before, which the Actions cache carries on. Opens or
#                 comments on the `nightly-analysis` issue when a harness finds a crash.
#
# A crash is uploaded as an artifact. Fixing it adds the input to regressions/<harness>/
# (the file as libFuzzer wrote it), so that ctest replays it from then on.
#
# Pool use: one job, one runner, a few minutes of the build and the budget below. It is
# not a required check: no ruleset names anything in this workflow.

on:
  push:
    branches: [develop]
    paths:
      - "src/lib/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: Mutation budget per harness, in seconds
        type: number
        default: 600
      ref:
        description: The branch to fuzz
        type: string
        default: develop

permissions: {}

concurrency:
  group: fuzz-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  fuzz:
    name: ${{ github.event_name == 'push' && 'fuzz-short' || 'fuzz-nightly' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write # report-nightly-failure
    env:
      VCPKG_MAX_CONCURRENCY: "2"
      SECONDS_PER_TARGET: ${{ github.event_name == 'push' && '60' || inputs.seconds_per_target || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          cache-key-suffix: x64-linux

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      # Clang parses with the newest libstdc++ it can find, and <mdspan> is in 16.
      - name: Install GCC 16 (for its libstdc++)
        uses: $/.github/actions/install-gcc

      - name: Install vcpkg build dependencies
        run: sudo apt-get install -y libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      # libclang-rt-23-dev carries libFuzzer and the sanitizer runtimes; the archive lists
      # it only as a Recommends, and install-llvm.sh installs without those.
      - name: Install Clang 23
        run: bash ci/install-llvm.sh 23 clang-23 libclang-rt-23-dev

      - name: Configure
        run: cmake --preset linux-clang-fuzz -DCMAKE_CXX_COMPILER=clang++-23

      - name: Build
        run: cmake --build --preset linux-clang-fuzz

      # The corpus grows: a cache entry cannot be updated, so each run saves a new one
      # under its own id and restores the newest.
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz every harness
        id: fuzz
        run: bash ci/fuzz-run.sh build/linux-clang-fuzz/bin build/fuzz-corpus "$SECONDS_PER_TARGET"

      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Keep the crashes
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: build/fuzz-crashes
          if-no-files-found: ignore
          retention-days: 30

      - name: Open or update the nightly-analysis issue
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: iainchesworthlabs/icl-common-infra/actions/report-nightly-failure@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          engine: fuzz
          detail: A fuzz harness crashed or failed. The input is in the fuzz-crashes artifact of the run; add it to src/lib/fuzz/regressions/<harness>/ with the fix.

      - name: Save vcpkg binaries
        if: ${{ always() }}
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
