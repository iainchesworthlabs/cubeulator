version = 1

# Files without an SPDX header take the licence below; files with a header keep theirs.
# The source files (C++, QML, JavaScript, GLSL, CMake, Python, shell, PowerShell) carry the
# header themselves. Documents, data, images, catalogues, templates and workflows are covered
# here.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Iain Chesworth"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The CMake modules copied from icl-common-infra by tools/ci/sync_cmake.py. They carry their
# licence in the file and are held to their source, so the copyright is stated here.
[[annotations]]
path = "cmake/icl/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Iain Chesworth Labs contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Bundled typefaces. Their licence texts are in the same directories.
[[annotations]]
path = ["src/app/qt/fonts/Archivo-*.ttf", "src/app/qt/fonts/OFL-Archivo.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Archivo Project Authors (https://github.com/Omnibus-Type/Archivo)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/app/qt/fonts/IBMPlexMono-*.ttf", "src/app/qt/fonts/OFL-IBMPlexMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/app/platform/web/fonts/NotoSansJP-Subset.ttf", "src/app/platform/web/fonts/OFL-NotoSansJP.txt", "src/app/platform/web/fonts/NotoSansSC-Subset.ttf", "src/app/platform/web/fonts/OFL-NotoSansSC.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2021 Adobe (http://www.adobe.com/)"
SPDX-License-Identifier = "OFL-1.1"

# The licence texts and notices of the components Cubeulator is built with, kept to be shown
# in the app and shipped in the packages. Each is distributed under the terms it states.
[[annotations]]
path = "third_party/notices/licences/**"
precedence = "override"
SPDX-FileCopyrightText = "The authors of the components they cover (see third_party/notices/manifest.json)"
SPDX-License-Identifier = "LicenseRef-Third-Party-Notice"

# The overlay of the vcpkg registry's tracy port: the registry's port files, with patches to
# Tracy's own sources.
[[annotations]]
path = ["vcpkg-overlay-ports/tracy/portfile.cmake", "vcpkg-overlay-ports/tracy/vcpkg.json"]
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation and the vcpkg contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vcpkg-overlay-ports/tracy/*.patch"
precedence = "override"
SPDX-FileCopyrightText = "The Tracy Profiler contributors (https://github.com/wolfpld/tracy)"
SPDX-License-Identifier = "BSD-3-Clause"
